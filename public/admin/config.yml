---
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: platomat/hautoo
  branch: main
  base_url: https://hautoo-sveltia-cms-auth.platomat.workers.dev

# PAT login for now; GitHub App + Cloudflare Worker later.
# Admin UI: /admin/ (src/pages/admin.html); config: this file.

media_folder: src/assets # unused for entry-relative media; kept as fallback
public_folder: /assets

output:
  omit_empty_optional_fields: true

# -----------------------------------------------------------------------------
# Shared field partials (YAML anchors) — DRY across collections.
# Aliases only work inside THIS file. Inject with: - *field_seo
# Astro Zod mirror: src/cms/fields/seo.ts
# -----------------------------------------------------------------------------

collections:
  - name: pages
    label: Seiten
    label_singular: Seite
    folder: src/content/pages
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Beschreibung, widget: string, required: false }
      - name: parent
        label: Übergeordnete Seite
        widget: relation
        collection: pages
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: "Optional. URL wird /eltern-slug/diese-seite/."
      - &field_seo
        label: SEO
        name: seo
        widget: object
        required: true
        collapsed: true
        default:
          index_visibility: index
          follow_visibility: follow
          noarchive: false
          noimageindex: false
          nosnippet: false
          max_snippet_enabled: true
          max_snippet: -1
          max_video_preview_enabled: true
          max_video_preview: -1
          max_image_preview_enabled: true
          max_image_preview: large
        summary: "{{fields.seo_title}}"
        hint: "Titel, Meta Description und Robots. Beim Build → <title>, description und <meta name=\"robots\">."
        fields:
          - label: SEO Title
            name: seo_title
            widget: string
            required: false
            hint: "Optional — leer lassen = Seitentitel (H1) wird beim Build verwendet."
          - label: Meta Description
            name: seo_description
            widget: text
            required: false
            hint: "Optional — Fallback: Feld Beschreibung der Seite."
          - label: Index / Noindex
            name: index_visibility
            widget: select
            options:
              - { label: Index, value: index }
              - { label: Kein Index (Noindex), value: noindex }
            default: index
            required: true
            hint: "Ob Suchmaschinen diese Seite in den Suchergebnissen aufnehmen (Index) oder ausblenden (Noindex)."
          - label: Follow / Nofollow
            name: follow_visibility
            widget: select
            options:
              - { label: Follow, value: follow }
              - { label: Nofollow, value: nofollow }
            default: follow
            required: true
            hint: "Ob Suchmaschinen Links auf dieser Seite folgen (Follow) oder ignorieren (Nofollow)."
          - label: Kein Archiv (Noarchive)
            name: noarchive
            widget: boolean
            default: false
            hint: "Suchmaschinen sollen keine zwischengespeicherte Version der Seite anzeigen."
          - label: Kein Bildverzeichnis (Noimageindex)
            name: noimageindex
            widget: boolean
            default: false
            hint: "Bilder auf dieser Seite nicht in der Google-Bildersuche indexieren."
          - label: Kein Snippet (Nosnippet)
            name: nosnippet
            widget: boolean
            default: false
            hint: "Keinen Textausschnitt (Snippet) in den Suchergebnissen anzeigen."
          - label: "Erweitert: Max Snippet"
            name: max_snippet_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Snippet-Länge in den Suchergebnissen aktivieren."
          - label: Max Snippet (Zeichen)
            name: max_snippet
            widget: number
            value_type: int
            default: -1
            required: false
            hint: "-1 = unbegrenzt"
          - label: "Erweitert: Max. Videovorschau"
            name: max_video_preview_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Videovorschau in den Suchergebnissen aktivieren."
          - label: Max. Videovorschau (Sekunden)
            name: max_video_preview
            widget: number
            value_type: int
            default: -1
            required: false
            hint: "-1 = unbegrenzt"
          - label: "Erweitert: Max. Bildvorschau"
            name: max_image_preview_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Bildvorschau in den Suchergebnissen aktivieren."
          - label: Max. Bildvorschaugröße
            name: max_image_preview
            widget: select
            options:
              - { label: Keine, value: none }
              - { label: Standard, value: standard }
              - { label: Groß, value: large }
            default: large
            required: false
            hint: "Maximale Bildgröße in der Google-Suchvorschau."
      - { name: body, label: Inhalt, widget: markdown }

  # Menus: filename = slot id (main, footer-legal, …). Navigation is not driven by page flags.
  - name: menus
    label: Menüs
    label_singular: Menü
    folder: src/content/menus
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} ({{slug}})"
    hint: "Bekannte Slugs: main (Hauptmenü), footer-legal (Copyright-Zeile). Weitere Footer-Menüs später als neue Dateien."
    fields:
      - {
          name: title,
          label: Titel,
          widget: string,
          hint: "Anzeige im CMS (z. B. Hauptmenü). Der Dateiname/Slug steuert, wo das Menü erscheint.",
        }
      - name: items
        label: Einträge
        widget: list
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string }
          - name: linkType
            label: Link-Art
            widget: select
            options:
              - { label: Seite, value: page }
              - { label: URL, value: url }
            default: page
            required: true
          - name: page
            label: Seite
            widget: relation
            collection: pages
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            required: false
            hint: "Bei Link-Art „Seite“."
          - {
              name: url,
              label: URL,
              widget: string,
              required: false,
              hint: "Bei Link-Art „URL“ — intern (/pfad/) oder https://…",
            }
          - {
              name: cssClass,
              label: CSS-Klasse,
              widget: string,
              required: false,
              hint: "Optional am <a>-Link (wie WordPress). Mehrere Klassen mit Leerzeichen, z. B. btn highlight.",
            }
          - name: children
            label: Untermenü
            widget: list
            required: false
            summary: "{{fields.label}}"
            hint: "Eine Ebene Unterpunkte (optional)."
            fields:
              - { name: label, label: Label, widget: string }
              - name: linkType
                label: Link-Art
                widget: select
                options:
                  - { label: Seite, value: page }
                  - { label: URL, value: url }
                default: page
                required: true
              - name: page
                label: Seite
                widget: relation
                collection: pages
                value_field: "{{slug}}"
                search_fields: [title]
                display_fields: [title]
                required: false
              - {
                  name: url,
                  label: URL,
                  widget: string,
                  required: false,
                }
              - {
                  name: cssClass,
                  label: CSS-Klasse,
                  widget: string,
                  required: false,
                  hint: "Optional am <a>-Link. Mehrere Klassen mit Leerzeichen.",
                }

  - name: tags
    label: Tags
    label_singular: Tag
    folder: src/content/tags
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Schlagworte für Artikel. Dateiname = Slug."
    fields:
      - { name: title, label: Name, widget: string }
      - {
          name: description,
          label: Beschreibung,
          widget: text,
          required: false,
        }

  - name: articles
    label: Artikel
    label_singular: Artikel
    folder: src/content/articles
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Medien neben dem Eintrag (Variante B). URL: /artikel/<slug>/."
    fields:
      - { name: title, label: Titel, widget: string }
      - {
          name: summary,
          label: Zusammenfassung,
          widget: text,
          required: false,
        }
      - {
          name: pubDate,
          label: Publikationsdatum,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          required: true,
        }
      - {
          name: draft,
          label: Entwurf,
          widget: boolean,
          default: false,
          hint: "Entwürfe erscheinen nicht auf der Website.",
        }
      - {
          name: heroImage,
          label: Titelbild,
          widget: image,
          required: false,
          hint: "Wird neben index.md gespeichert (Variante B).",
        }
      - name: tags
        label: Tags
        widget: relation
        collection: tags
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - name: videoProvider
        label: Video-Anbieter
        widget: select
        options:
          - { label: Keins, value: "" }
          - { label: YouTube, value: youtube }
          - { label: Vimeo, value: vimeo }
        default: ""
        required: false
      - {
          name: videoId,
          label: Video-ID oder URL,
          widget: string,
          required: false,
          hint: "YouTube-/Vimeo-ID oder URL.",
        }
      - *field_seo
      - { name: body, label: Inhalt, widget: markdown }

  # Later: glossar
