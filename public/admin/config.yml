---
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: platomat/hautoo
  branch: main
  base_url: https://hautoo-sveltia-cms-auth.platomat.workers.dev

# PAT login for now; GitHub App + Cloudflare Worker later.
# Admin UI: /admin/ (src/pages/admin.html); config: this file.

# Shared media library (Sveltia “Uncategorized” / all assets).
# Files live in src/assets; frontmatter stores /assets/… — resolved by src/lib/cms-image.ts
media_folder: src/assets
public_folder: /assets

output:
  omit_empty_optional_fields: true

# -----------------------------------------------------------------------------
# Shared field partials (YAML anchors) — DRY across collections.
# Aliases only work inside THIS file. Inject with: - *field_seo
# Astro Zod mirrors: src/cms/fields/seo.ts, src/cms/fields/page-background.ts,
# src/cms/fields/status.ts, src/cms/fields/dates.ts
# -----------------------------------------------------------------------------

# Page / article full-viewport background (inject as three list items).
# - *field_background_image
# - *field_background_overlay
# - *field_background_attribution

# Editorial status (pages, articles, glossar — not tags/menus)
# - *field_status
# - *field_publish_date  (pages/glossar; articles use pubDate)

# Last change (all collections; SEO meta only for now)
# - *field_modified_date

# Optional TOC / Hero after hero block (pages, articles)
# - *field_show_toc
# - *field_toc_title
# - *field_toc_levels
# - *field_hero_text_align
# - *field_show_breadcrumbs
# - *field_hero_border_bottom

collections:

  - name: pages
    label: Seiten
    label_singular: Seite
    folder: src/content/pages
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Beschreibung, widget: string, required: false }
      - &field_status
        name: status
        label: Status
        widget: select
        options:
          - { label: Entwurf, value: draft }
          - { label: Veröffentlicht, value: published }
          - { label: Geplant, value: future }
          - { label: Papierkorb, value: trash }
        default: draft
        required: true
        hint: "Nur „Veröffentlicht“ und fällige „Geplant“-Einträge erscheinen auf der Website."
      - &field_publish_date
        name: publishDate
        label: Veröffentlichungsdatum
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: "Für Status „Geplant“: ab diesem Datum öffentlich (nach dem nächsten Build)."
      - &field_modified_date
        name: modifiedDate
        label: Zuletzt geändert
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: "Letzte inhaltliche Änderung. Wird im Seitenkopf als SEO-Meta ausgegeben (noch nicht sichtbar auf der Seite)."
      - name: parent
        label: Übergeordnete Seite
        widget: relation
        collection: pages
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: "Optional. URL wird /eltern-slug/diese-seite/."
      - &field_background_image
        name: backgroundImage
        label: Seitenhintergrund
        widget: image
        required: false
        hint: "Vollflächig hinter der sichtbaren Seite (Viewport). Header und Footer bleiben darüber."
      - &field_background_overlay
        name: backgroundOverlay
        label: Abdunkelung (%)
        widget: number
        value_type: int
        min: 0
        max: 100
        default: 40
        required: false
        hint: "Schwarzes Overlay über dem Hintergrundbild. 0 = keine Abdunkelung, 100 = fast schwarz."
      - &field_background_attribution
        name: backgroundAttribution
        label: Bildnachweis
        widget: text
        required: false
        hint: "Text, reine URL oder HTML 1:1 von Unsplash/Pexels („Copy attribution“). Nur <a href> wird übernommen; erscheint automatisch am Ende des Impressums."
      - &field_show_toc
        name: showToc
        label: Inhaltsverzeichnis
        widget: boolean
        required: false
        hint: "Leer lassen = globale Config (Content → TOC). An/Aus überschreibt die globale Vorgabe für diesen Eintrag."
      - &field_toc_title
        name: tocTitle
        label: TOC-Titel
        widget: string
        required: false
        hint: "Leer = Titel aus der globalen Config. Sonst lokale Überschrift über dem Verzeichnis."
      - &field_toc_levels
        name: tocLevels
        label: TOC-Ebenen
        widget: select
        multiple: true
        options:
          - { label: h2, value: h2 }
          - { label: h3, value: h3 }
          - { label: h4, value: h4 }
        required: false
        hint: "Leer = Ebenen aus der globalen Config. Sonst lokale Auswahl."
      - &field_content_width
        name: contentWidth
        label: Inhaltsbreite
        widget: select
        required: false
        options:
          - { label: Standard (Lesespalte), value: default }
          - { label: Breit, value: wide }
          - { label: Vollbreit, value: full }
        hint: "Leer = globale Config (Content → Breite). Listing-Embeds wählen ohne gesetztes Feld automatisch „Breit“."
      - &field_hero_text_align
        name: heroTextAlign
        label: Hero-Ausrichtung
        widget: select
        required: false
        options:
          - { label: Links, value: left }
          - { label: Zentriert, value: center }
          - { label: Rechts, value: right }
        hint: "Leer = Default der Collection (Einstellungen → Design → Hero). Ausrichtung für Brotkrumen, Titel und Beschreibung."
      - &field_show_breadcrumbs
        name: showBreadcrumbs
        label: Brotkrumen anzeigen
        widget: boolean
        required: false
        hint: "Leer lassen = Default der Collection (Einstellungen → Design → Hero). An/Aus überschreibt die globale Vorgabe."
      - &field_hero_border_bottom
        name: heroBorderBottom
        label: Hero-Trennlinie unten
        widget: boolean
        required: false
        hint: "Leer lassen = Default der Collection (Einstellungen → Design → Hero). An = 1px Linie unter dem Hero."
      - name: body
        label: Inhalt
        widget: markdown
        hint: "Blöcke „Artikel-Listing“, „Glossar-Listing“, „Tag-Listing“, „Kategorie-Listing“, „Baustein“, „Repo-Dokument“, „Tagwolke“, „Video“, „Trennlinie“, „Button“ und „Kontakt-E-Mail“ über die Toolbar einfügen (wie Bilder)."
        editor_components:
          - image
          - code-block
          - article-listing
          - glossar-listing
          - tag-listing
          - category-listing
          - block
          - repodoc
          - tag-cloud
          - contact-email
          - video
          - video-consent-reset
          - separator
          - button
      - &field_seo
        label: SEO
        name: seo
        widget: object
        required: true
        collapsed: true
        default:
          index_visibility: index
          follow_visibility: follow
          noarchive: false
          noimageindex: false
          nosnippet: false
          max_snippet_enabled: true
          max_snippet: -1
          max_video_preview_enabled: true
          max_video_preview: -1
          max_image_preview_enabled: true
          max_image_preview: large
        summary: "{{fields.seo_title}}"
        hint: "Titel, Meta Description und Robots. Beim Build → <title>, description und <meta name=\"robots\">."
        fields:
          - label: SEO Title
            name: seo_title
            widget: string
            required: false
            hint: "Optional — leer lassen = Seitentitel (H1) wird beim Build verwendet."
          - label: Meta Description
            name: seo_description
            widget: text
            required: false
            hint: "Optional — Fallback: Feld Beschreibung der Seite."
          - label: Index / Noindex
            name: index_visibility
            widget: select
            options:
              - { label: Index, value: index }
              - { label: Kein Index (Noindex), value: noindex }
            default: index
            required: true
            hint: "Ob Suchmaschinen diese Seite in den Suchergebnissen aufnehmen (Index) oder ausblenden (Noindex)."
          - label: Follow / Nofollow
            name: follow_visibility
            widget: select
            options:
              - { label: Follow, value: follow }
              - { label: Nofollow, value: nofollow }
            default: follow
            required: true
            hint: "Ob Suchmaschinen Links auf dieser Seite folgen (Follow) oder ignorieren (Nofollow)."
          - label: Kein Archiv (Noarchive)
            name: noarchive
            widget: boolean
            default: false
            hint: "Suchmaschinen sollen keine zwischengespeicherte Version der Seite anzeigen."
          - label: Kein Bildverzeichnis (Noimageindex)
            name: noimageindex
            widget: boolean
            default: false
            hint: "Bilder auf dieser Seite nicht in der Google-Bildersuche indexieren."
          - label: Kein Snippet (Nosnippet)
            name: nosnippet
            widget: boolean
            default: false
            hint: "Keinen Textausschnitt (Snippet) in den Suchergebnissen anzeigen."
          - label: "Erweitert: Max Snippet"
            name: max_snippet_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Snippet-Länge in den Suchergebnissen aktivieren."
          - label: Max Snippet (Zeichen)
            name: max_snippet
            widget: number
            value_type: int
            default: -1
            required: false
            hint: "-1 = unbegrenzt"
          - label: "Erweitert: Max. Videovorschau"
            name: max_video_preview_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Videovorschau in den Suchergebnissen aktivieren."
          - label: Max. Videovorschau (Sekunden)
            name: max_video_preview
            widget: number
            value_type: int
            default: -1
            required: false
            hint: "-1 = unbegrenzt"
          - label: "Erweitert: Max. Bildvorschau"
            name: max_image_preview_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Bildvorschau in den Suchergebnissen aktivieren."
          - label: Max. Bildvorschaugröße
            name: max_image_preview
            widget: select
            options:
              - { label: Keine, value: none }
              - { label: Standard, value: standard }
              - { label: Groß, value: large }
            default: large
            required: false
            hint: "Maximale Bildgröße in der Google-Suchvorschau."
      - name: headCode
        label: Header-Code
        widget: code
        required: false
        output_code_only: true
        default_language: html
        hint: "Optional. Roh eingefügt vor </head> — z. B. <style>…</style> oder <script>…</script>. Nur für vertrauenswürdige Redaktion."
      - name: footerCode
        label: Footer-Code
        widget: code
        required: false
        output_code_only: true
        default_language: html
        hint: "Optional. Roh eingefügt vor </body> — z. B. <script>…</script>. Nur für vertrauenswürdige Redaktion."

  - name: articles
    label: Artikel
    label_singular: Artikel
    folder: src/content/articles
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Medien neben dem Eintrag (Variante B). URL: /artikel/<slug>/."
    fields:
      - { name: title, label: Titel, widget: string }
      - {
          name: summary,
          label: Zusammenfassung,
          widget: text,
          required: false,
        }
      - {
          name: pubDate,
          label: Publikationsdatum,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          required: true,
          hint: "Auch Termin für Status „Geplant“.",
        }
      - *field_status
      - *field_modified_date
      - {
          name: heroImage,
          label: Titelbild,
          widget: image,
          required: false,
          hint: "Wird neben index.md gespeichert (Variante B).",
        }
      - *field_background_image
      - *field_background_overlay
      - *field_background_attribution
      - name: categories
        label: Kategorien
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Optional. Hierarchische Themengruppen (Parent an der Kategorie selbst)."
      - name: tags
        label: Tags
        widget: relation
        collection: tags
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - name: tagPlacement
        label: Tags anzeigen
        widget: select
        options:
          - { label: Im Hero (neben Kategorien), value: hero }
          - { label: Nach dem Inhalt, value: after }
          - { label: Hero und nach dem Inhalt, value: both }
        default: hero
        required: false
        hint: "Kategorien stehen immer im Hero unter der Beschreibung. Tags wahlweise dort (rechts daneben), nach dem Inhalt (vor der Artikel-Navigation) oder beides."
      - name: videoProvider
        label: Video-Anbieter
        widget: select
        options:
          - { label: Keins, value: "" }
          - { label: YouTube, value: youtube }
          - { label: Vimeo, value: vimeo }
        default: ""
        required: false
      - {
          name: videoId,
          label: Video-ID oder URL,
          widget: string,
          required: false,
          hint: "YouTube-/Vimeo-ID oder URL.",
        }
      - *field_show_toc
      - *field_toc_title
      - *field_toc_levels
      - *field_content_width
      - *field_hero_text_align
      - *field_show_breadcrumbs
      - *field_hero_border_bottom
      - name: body
        label: Inhalt
        widget: markdown
        hint: "Blöcke „Artikel-Listing“, „Glossar-Listing“, „Tag-Listing“, „Kategorie-Listing“, „Baustein“, „Repo-Dokument“, „Tagwolke“, „Video“, „Trennlinie“, „Button“ und „Kontakt-E-Mail“ über die Toolbar einfügen (wie Bilder)."
        editor_components:
          - image
          - code-block
          - article-listing
          - glossar-listing
          - tag-listing
          - category-listing
          - block
          - repodoc
          - tag-cloud
          - contact-email
          - video
          - video-consent-reset
          - separator
          - button
      - *field_seo


  - name: categories
    label: Kategorien
    label_singular: Kategorie
    folder: src/content/categories
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Hierarchische Themen für Artikel (wie WordPress). Optional Parent. Dateiname = Slug. URL: /kategorien/<slug>/."
    fields:
      - { name: title, label: Name, widget: string }
      - {
          name: description,
          label: Beschreibung,
          widget: text,
          required: false,
        }
      - name: parent
        label: Übergeordnete Kategorie
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: "Optional. Bildet eine Hierarchie; die öffentliche URL bleibt flach (/kategorien/<slug>/)."
      - *field_modified_date

  - name: tags
    label: Tags
    label_singular: Tag
    folder: src/content/tags
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Schlagworte für Artikel. Dateiname = Slug."
    fields:
      - { name: title, label: Name, widget: string }
      - {
          name: description,
          label: Beschreibung,
          widget: text,
          required: false,
        }
      - *field_modified_date

  - name: glossar
    label: Glossar
    label_singular: Begriff
    folder: src/content/glossar
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Fachbegriffe. URL: /glossar/<slug>/."
    fields:
      - { name: title, label: Begriff, widget: string }
      - *field_status
      - *field_publish_date
      - *field_modified_date
      - {
          name: definition,
          label: Kurzdefinition,
          widget: text,
          hint: "Ein bis drei Sätze — erscheint in der Glossar-Liste.",
        }
      - name: relatedArticles
        label: Verwandte Artikel
        widget: relation
        collection: articles
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - name: relatedTags
        label: Verwandte Tags
        widget: relation
        collection: tags
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Zusätzlich zum automatischen Tag mit gleichem Slug (z. B. Glossar astro → #astro)."
      - {
          name: body,
          label: Längere Erklärung,
          widget: markdown,
          required: false,
        }
      - *field_seo

  - name: blocks
    label: Bausteine
    label_singular: Baustein
    folder: src/content/blocks
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} ({{slug}})"
    hint: "Wiederverwendbare Inhaltsstücke ohne eigene URL. Einbinden mit Toolbar „Baustein“ bzw. {{block id=\"slug\"}}."
    fields:
      - {
          name: title,
          label: Titel,
          widget: string,
          hint: "Nur im CMS. Der Dateiname/Slug ist die id für {{block id=\"…\"}}.",
        }
      - *field_status
      - *field_publish_date
      - *field_modified_date
      - name: body
        label: Inhalt
        widget: markdown
        hint: "Gleicher Markdown-Editor wie bei Seiten; kann Listings, Bilder und weitere Bausteine enthalten."
        editor_components:
          - image
          - code-block
          - article-listing
          - glossar-listing
          - tag-listing
          - category-listing
          - block
          - repodoc
          - tag-cloud
          - contact-email
          - video
          - video-consent-reset
          - separator
          - button

  # Menus: filename = slot id (main, footer-legal, …). Navigation is not driven by page flags.
  - name: menus
    label: Menüs
    label_singular: Menü
    folder: src/content/menus
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} ({{slug}})"
    hint: "Bekannte Slugs: main (Hauptmenü), footer-legal (Copyright-Zeile). Weitere Footer-Menüs später als neue Dateien."
    fields:
      - {
          name: title,
          label: Titel,
          widget: string,
          hint: "Anzeige im CMS (z. B. Hauptmenü). Der Dateiname/Slug steuert, wo das Menü erscheint.",
        }
      - *field_modified_date
      - name: items
        label: Einträge
        widget: list
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string }
          - name: linkType
            label: Link-Art
            widget: select
            options:
              - { label: Seite, value: page }
              - { label: URL, value: url }
            default: page
            required: true
          - name: page
            label: Seite
            widget: relation
            collection: pages
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            required: false
            hint: "Bei Link-Art „Seite“."
          - {
              name: url,
              label: URL,
              widget: string,
              required: false,
              hint: "Bei Link-Art „URL“ — intern (/pfad/) oder https://…",
            }
          - {
              name: cssClass,
              label: CSS-Klasse,
              widget: string,
              required: false,
              hint: "Optional am <a>-Link (wie WordPress). Mehrere Klassen mit Leerzeichen, z. B. btn highlight.",
            }
          - name: children
            label: Untermenü
            widget: list
            required: false
            summary: "{{fields.label}}"
            hint: "Eine Ebene Unterpunkte (optional)."
            fields:
              - { name: label, label: Label, widget: string }
              - name: linkType
                label: Link-Art
                widget: select
                options:
                  - { label: Seite, value: page }
                  - { label: URL, value: url }
                default: page
                required: true
              - name: page
                label: Seite
                widget: relation
                collection: pages
                value_field: "{{slug}}"
                search_fields: [title]
                display_fields: [title]
                required: false
              - {
                  name: url,
                  label: URL,
                  widget: string,
                  required: false,
                }
              - {
                  name: cssClass,
                  label: CSS-Klasse,
                  widget: string,
                  required: false,
                  hint: "Optional am <a>-Link. Mehrere Klassen mit Leerzeichen.",
                }


  # Global settings (JSON files, like cdr-legal). Separate CMS entries per area.
  - name: settings
    label: Einstellungen
    label_singular: Einstellung
    delete: false
    files:
      - name: general
        label: General
        file: src/content/settings/general.json
        format: json
        fields:
          - name: websiteTitle
            label: Website title
            widget: string
            required: true
            hint: "Markenname in Header, Browser-Titel-Suffix und og:site_name."
            default: hautuu
          - name: contactEmail
            label: Contact email
            widget: string
            required: false
            hint: "Optional für {{contact-email}} (Impressum/Datenschutz). Überschreibt CONTACT_EMAIL beim Build. Steht im öffentlichen Repo; leer lassen und ENV nutzen, wenn die Adresse nicht in Git soll."
            default: ""
      - name: design
        label: Design
        file: src/content/settings/design.json
        format: json
        fields:
          - name: header
            label: Header
            widget: object
            collapsed: false
            hint: "Pro Breakpoint: zuerst Ruhehöhe (Seitenanfang), dann Sticky ein/aus, dann kompakte Höhe wenn Sticky durch Scrollen greift. Desktop ≥1024px, Tablet 680–1023px, Mobile <680px."
            fields:
              - name: minHeightDesktop
                label: Ruhehöhe Desktop (px)
                widget: number
                value_type: int
                default: 64
                min: 40
                max: 600
                hint: "Höhe am Seitenanfang. Mit Sticky gilt sie, bis die Leiste festklebt; ohne Sticky Mindesthöhe (darf wachsen)."
              - name: minHeightTablet
                label: Ruhehöhe Tablet (px)
                widget: number
                value_type: int
                default: 64
                min: 40
                max: 600
              - name: minHeightMobile
                label: Ruhehöhe Mobile (px)
                widget: number
                value_type: int
                default: 56
                min: 40
                max: 600
              - name: stickyDesktop
                label: Sticky auf Desktop
                widget: boolean
                default: true
              - name: stickyTablet
                label: Sticky auf Tablet
                widget: boolean
                default: true
              - name: stickyMobile
                label: Sticky auf Mobile
                widget: boolean
                default: true
              - name: heightDesktop
                label: Höhe sticky Desktop (px)
                widget: number
                value_type: int
                default: 64
                min: 40
                max: 600
                hint: "Kompakte Leistenhöhe, sobald Sticky durch Scrollen aktiv ist."
              - name: heightTablet
                label: Höhe sticky Tablet (px)
                widget: number
                value_type: int
                default: 64
                min: 40
                max: 600
              - name: heightMobile
                label: Höhe sticky Mobile (px)
                widget: number
                value_type: int
                default: 56
                min: 40
                max: 600
          - name: hero
            label: Hero
            widget: object
            collapsed: false
            hint: "Titelbereich pro Collection (Reihenfolge wie in der CMS-Leiste). Einzelne Einträge bei Seiten/Artikeln können überschreiben."
            fields:
              - name: pages
                label: Seiten
                widget: object
                collapsed: false
                fields:
                  - name: textAlign
                    label: Textausrichtung
                    widget: select
                    options:
                      - { label: Links, value: left }
                      - { label: Zentriert, value: center }
                      - { label: Rechts, value: right }
                    default: left
                    required: true
                    hint: "Gilt für Brotkrumen, Titel und Beschreibung."
                  - name: showBreadcrumbs
