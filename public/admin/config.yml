        format: json
        fields:
          - name: toc
            label: Inhaltsverzeichnis (TOC)
            widget: object
            collapsed: false
            hint: "Globale TOC-Defaults. Einzelne Seiten/Artikel überschreiben mit ihren TOC-Feldern."
            fields:
              - name: pages
                label: Seiten
                widget: object
                fields:
                  - name: enabled
                    label: Standardmäßig anzeigen
                    widget: boolean
                    default: false
                  - name: levels
                    label: Ebenen
                    widget: select
                    multiple: true
                    options:
                      - { label: h2, value: h2 }
                      - { label: h3, value: h3 }
                      - { label: h4, value: h4 }
                    default: [h2]
                  - name: title
                    label: TOC-Titel
                    widget: string
                    default: Inhalt
              - name: articles
                label: Artikel
                widget: object
                fields:
                  - name: enabled
                    label: Standardmäßig anzeigen
                    widget: boolean
                    default: false
                  - name: levels
                    label: Ebenen
                    widget: select
                    multiple: true
                    options:
                      - { label: h2, value: h2 }
                      - { label: h3, value: h3 }
                      - { label: h4, value: h4 }
                    default: [h2]
                  - name: title
                    label: TOC-Titel
                    widget: string
                    default: Inhalt
          - name: width
            label: Inhaltsbreite
            widget: object
            collapsed: false
            hint: "Default-Breite, wenn Seite/Artikel kein eigenes Feld setzt und kein Listing-Embed die Breite auf „breit“ hebt."
            fields:
              - name: pages
                label: Seiten (Standard)
                widget: select
                options:
