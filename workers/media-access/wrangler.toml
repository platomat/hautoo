# Cloudflare Worker: gated private R2 media (access codes in D1).
# Deploy from this folder: npx wrangler deploy
# Secrets/bindings: see README.md (never commit real codes or SIGNING_SECRET).

name = "hautoo-member-media-access"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hautoo-member-media"

# Create once: npx wrangler d1 create hautoo
# Then paste database_id here and run: npx wrangler d1 migrations apply hautoo --remote
[[d1_databases]]
binding = "DB"
database_name = "hautoo"
database_id = "8fe69fc0-93ed-4b27-abf6-d98949818205"
migrations_dir = "migrations"

[vars]
# Comma-separated browser origins allowed to call /unlock and /sign
ALLOWED_ORIGINS = "https://hautoo.storyofai.net,http://localhost:4321"
# Optional key prefix inside the bucket (no leading slash)
MEDIA_KEY_PREFIX = ""
