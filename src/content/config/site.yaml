# Global site settings (Sveltia collection `config`, file `site`). YAML, no Markdown.
general:
  websiteTitle: hautuu
  # Optional; if set, overrides CONTACT_EMAIL (value is public in Git). Leave empty to use ENV.
  contactEmail: ""
design:
  header:
    stickyDesktop: true
    stickyTablet: true
    stickyMobile: true
    heightDesktop: 64
    heightTablet: 64
    heightMobile: 56
  hero:
    textAlign: left
    showBreadcrumbs: true
    borderBottom: false
content:
  toc:
    pages:
      enabled: false
      levels:
        - h2
      title: Inhalt
    articles:
      enabled: false
      levels:
        - h2
      title: Inhalt
  width:
    pages: default
    articles: default
